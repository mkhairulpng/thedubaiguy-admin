name: Patch Observability UI
on:
  push:
    branches:
      - observability-country-table-20260921
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[observability-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Observability patch
        run: node scripts/patch-observability.js
      - name: Validate JavaScript
        run: |
          node --check server/api/dashboard.js
          node --check server/api/analytics.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/api/dashboard.js
          git diff --cached --quiet || git commit -m "Add GA4 country observability tables [observability-patched]"
          git push
