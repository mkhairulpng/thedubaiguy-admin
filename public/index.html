<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TheDubaiGuy Admin</title><meta name="robots" content="noindex,nofollow"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#242526;color:#fff}body{display:grid;place-items:center;padding:24px}.login{width:min(430px,100%);text-align:center}.logo{height:74px;display:flex;justify-content:center;align-items:center;margin-bottom:26px}.logo img{width:280px;max-width:90%;filter:grayscale(1) brightness(0) invert(1)}.card{background:#2c2d2f;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:30px;box-shadow:0 20px 70px rgba(0,0,0,.3)}h1{font-size:22px;margin:0 0 7px;font-weight:500}p{color:#aeb0b3;font-size:13px;margin:0 0 24px}.field{text-align:left;margin-bottom:14px}label{display:block;font-size:12px;color:#c7c8ca;margin-bottom:7px}input{width:100%;height:46px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:#202122;color:#fff;padding:0 13px;outline:none;font-size:14px}input:focus{border-color:rgba(255,255,255,.38)}button{width:100%;height:46px;border:1px solid rgba(255,255,255,.22);border-radius:10px;background:#f4f4f4;color:#202122;font-size:14px;font-weight:600;cursor:pointer}button:disabled{opacity:.6}.error{min-height:18px;color:#ddd;font-size:12px;margin:12px 0 0}.foot{margin-top:16px;color:#777;font-size:11px}@media(prefers-reduced-motion:no-preference){.card{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}</style></head><body><main class="login"><div class="logo"><img src="/tdg-logo.png" alt="TheDubaiGuy"></div><section class="card"><h1>Admin access</h1><p>Sign in to TheDubaiGuy administration.</p><form id="form"><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required autofocus></div><button id="submit">Sign in</button><div class="error" id="error"></div></form></section><div class="foot">TheDubaiGuy · Administration</div></main><script>const f=document.getElementById('form'),p=document.getElementById('password'),e=document.getElementById('error'),b=document.getElementById('submit');fetch('/api/auth/me',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d.authenticated)location.replace('/dashboard')});f.addEventListener('submit',async ev=>{ev.preventDefault();e.textContent='';b.disabled=true;b.textContent='Signing in…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Sign-in failed');location.replace('/dashboard')}catch(x){e.textContent=x.message;p.select()}finally{b.disabled=false;b.textContent='Sign in'}})</script></body></html>
